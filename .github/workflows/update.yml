name: Daily IV update

# Appends today's ATM-put IV (direct snapshot read) to every ticker —
# keeps each cache's endpoint fresh. Fast (~15 min). Runs automatically
# each weekday, and can also be triggered manually.
on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC ≈ 5:30 PM ET (after the US close) on weekdays, so each
    # row holds that day's closing IV. GitHub cron is UTC and may run
    # late — fine for a once-daily snapshot.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily IV update
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m iv_update

      - name: Commit IV cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iv/
          if git diff --staged --quiet; then
            echo "No IV changes to commit."
          else
            git commit -m "Daily IV update ($(date -u +%Y-%m-%d))"
            git push
          fi
