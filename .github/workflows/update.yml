name: Daily IV update

# RETIRED 2026-09-20. This repo was a temporary stand-in while GitLab
# compute was exhausted (May-June 2026). The private repo's GitLab
# `eod-run` job has owned the daily IV update since June; this one kept
# running weekdays for ~4 months, writing into `iv/` that nothing reads.
#
# Do NOT sync this repo's `iv/` data anywhere. It was produced by a May
# fork of the pipeline with no outlier scrub (`iv_scrub`, added
# 2026-08-31), so it is worse than the private repo's cache, not a
# supplement to it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily IV update
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m iv_update

      - name: Commit IV cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iv/
          if git diff --staged --quiet; then
            echo "No IV changes to commit."
          else
            git commit -m "Daily IV update ($(date -u +%Y-%m-%d))"
            git push
          fi
